<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email | YogaMood</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="auth-page">


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark yogamood-navbar">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="{{ url_for('home') }}">
            🌿 YogaMood
        </a>

        <a href="{{ url_for('home') }}"
           class="btn btn-outline-light rounded-pill px-4">

            Home

        </a>

    </div>

</nav>


<!-- VERIFY SECTION -->

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="auth-card">

                    <div class="text-center">

                        <div class="auth-icon">
                            ✉️
                        </div>

                        <h2 class="fw-bold mt-3">
                            Verify Your Email
                        </h2>

                        <p class="auth-subtitle">

                            We sent a 6-digit verification code to

                            <strong>{{ email }}</strong>

                        </p>

                    </div>


                    {% if error %}

                    <div class="alert alert-danger rounded-3">

                        {{ error }}

                    </div>

                    {% endif %}


                    {% if message %}

                    <div class="alert alert-success rounded-3">

                        {{ message }}

                    </div>

                    {% endif %}


                    <!-- VERIFY FORM -->

                    <form
                        method="POST"
                        action="{{ url_for('verify_email') }}">

                        <div class="mb-4">

                            <label class="form-label">

                                Verification Code

                            </label>

                            <input
                                type="text"
                                name="verification_code"
                                class="form-control text-center"
                                placeholder="Enter 6-digit code"
                                maxlength="6"
                                minlength="6"
                                inputmode="numeric"
                                required>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success w-100 rounded-pill py-2">

                            Verify Email

                        </button>

                    </form>


                    <!-- RESEND -->

                    <form
                        method="POST"
                        action="{{ url_for('resend_code') }}"
                        class="text-center mt-3">

                        <button
                            type="submit"
                            class="btn btn-link text-success text-decoration-none">

                            Resend Code

                        </button>

                    </form>


                    <div class="text-center mt-2">

                        <a
                            href="{{ url_for('login') }}"
                            class="text-success text-decoration-none">

                            ← Back to Login

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<footer class="auth-footer">

    <div class="container text-center">

        <small>
            🌿 YogaMood | Your Mood. Your Yoga. Your Balance.
        </small>

    </div>

</footer>


</body>
</html>
