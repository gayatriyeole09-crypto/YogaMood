<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | YogaMood</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- YogaMood CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="auth-page">


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark yogamood-navbar">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="{{ url_for('home') }}">
            🌿 YogaMood
        </a>

        <div class="ms-auto">

            <a
                href="{{ url_for('home') }}"
                class="btn btn-outline-light rounded-pill px-4">
                Home
            </a>

        </div>

    </div>

</nav>


<!-- ================= SIGNUP SECTION ================= -->

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-5">

                <div class="auth-card">

                    <!-- Icon -->

                    <div class="text-center">

                        <div class="auth-icon">
                            ✨
                        </div>

                        <h2 class="fw-bold mt-3">
                            Create Your Account
                        </h2>

                        <p class="auth-subtitle">
                            Join YogaMood and start your personalized journey.
                        </p>

                    </div>


                    <!-- Error -->

                    {% if error %}

                    <div class="alert alert-danger rounded-3">
                        {{ error }}
                    </div>

                    {% endif %}


                    <!-- Signup Form -->

                    <form
                        method="POST"
                        action="{{ url_for('signup') }}">

                        <!-- Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter your full name"
                                required>

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Create a password"
                                minlength="6"
                                required>

                        </div>


                        <!-- Confirm Password -->

                        <div class="mb-4">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                placeholder="Confirm your password"
                                minlength="6"
                                required>

                        </div>


                        <!-- Signup Button -->

                        <button
                            type="submit"
                            class="btn btn-success signup-btn w-100 rounded-pill py-2">

                            Create Account

                        </button>

                    </form>


                    <!-- Login -->

                    <div class="text-center mt-4">

                        <p class="login-text mb-0">

                            Already have an account?

                            <a
                                href="{{ url_for('login') }}"
                                class="text-success fw-semibold text-decoration-none">

                                Login

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- ================= FOOTER ================= -->

<footer class="auth-footer">

    <div class="container text-center">

        <small>
            🌿 YogaMood | Your Mood. Your Yoga. Your Balance.
        </small>

    </div>

</footer>


</body>
</html>
