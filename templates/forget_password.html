<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | YogaMood</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="auth-page">

<!-- NAVBAR -->

<nav class="navbar navbar-dark yogamood-navbar">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="{{ url_for('home') }}">
            🌿 YogaMood
        </a>

        <a
            href="{{ url_for('home') }}"
            class="btn btn-outline-light rounded-pill px-4">
            Home
        </a>

    </div>

</nav>


<!-- FORGOT PASSWORD -->

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="auth-card">

                    <div class="text-center">

                        <div class="auth-icon">
                            🔐
                        </div>

                        <h2 class="fw-bold mt-3">
                            Forgot Password?
                        </h2>

                        <p class="auth-subtitle">
                            Enter your registered email address.
                            We will send you a reset code.
                        </p>

                    </div>


                    {% if error %}

                    <div class="alert alert-danger rounded-3">
                        {{ error }}
                    </div>

                    {% endif %}


                    <form
                        method="POST"
                        action="{{ url_for('forgot_password') }}">

                        <div class="mb-4">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your registered email"
                                required>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success w-100 rounded-pill py-2">

                            Send Reset Code

                        </button>

                    </form>


                    <div class="text-center mt-4">

                        <a
                            href="{{ url_for('login') }}"
                            class="text-success text-decoration-none fw-semibold">

                            ← Back to Login

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<footer class="auth-footer">

    <div class="container text-center">

        <small>
            🌿 YogaMood | Your Mood. Your Yoga. Your Balance.
        </small>

    </div>

</footer>

</body>
</html>
