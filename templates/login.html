<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | YogaMood</title>

    <!-- Bootstrap 5.3.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- YogaMood CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="auth-page">


<!-- =========================================================
     NAVBAR
========================================================= -->

<nav class="navbar navbar-expand-lg navbar-dark yogamood-navbar">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="{{ url_for('home') }}">
            🌿 YogaMood
        </a>

        <a
            href="{{ url_for('home') }}"
            class="btn btn-outline-light rounded-pill px-4">

            Home

        </a>

    </div>

</nav>


<!-- =========================================================
     LOGIN SECTION
========================================================= -->

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-5">

                <div class="auth-card">


                    <!-- ICON + TITLE -->

                    <div class="text-center">

                        <div class="auth-icon">
                            🌿
                        </div>

                        <h2 class="fw-bold mt-3">
                            Welcome Back
                        </h2>

                        <p class="auth-subtitle">
                            Login to continue your YogaMood journey.
                        </p>

                    </div>


                    <!-- ERROR MESSAGE -->

                    {% if error %}

                    <div class="alert alert-danger rounded-3">

                        {{ error }}

                    </div>

                    {% endif %}


                    <!-- LOGIN FORM -->

                    <form
                        method="POST"
                        action="{{ url_for('login') }}">


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-2">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required>

                        </div>


                        <!-- FORGOT PASSWORD -->

                        <div class="text-end mb-4">

                            <a
                                href="{{ url_for('forgot_password') }}"
                                class="text-success text-decoration-none fw-semibold">

                                Forgot Password?

                            </a>

                        </div>


                        <!-- LOGIN BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-success signup-btn w-100 rounded-pill py-2">

                            Login

                        </button>

                    </form>


                    <!-- SIGN UP -->

                    <div class="text-center mt-4">

                        <p class="login-text mb-0">

                            Don't have an account?

                            <a
                                href="{{ url_for('signup') }}"
                                class="text-success fw-semibold text-decoration-none">

                                Create Account

                            </a>

                        </p>

                    </div>


                </div>

            </div>

        </div>

    </div>

</section>


<!-- =========================================================
     FOOTER
========================================================= -->

<footer class="auth-footer">

    <div class="container text-center">

        <small>
            🌿 YogaMood | Your Mood. Your Yoga. Your Balance.
        </small>

    </div>

</footer>


</body>
</html>
